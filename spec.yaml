schemaVersion: "2"
kind: sandbox
name: omp
displayName: OMP development shell
description: "Runs Oh My Pi with zsh, fnm, and repository-aware Node.js setup"

sandbox:
  image: "docker/sandbox-templates:shell-docker"
  entrypoint: [omp]
  command:
    default: ["--approval-mode=yolo"]

agentInstructions:
  filename: AGENTS.md

permissions:
  network:
    allow:
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      - download.docker.com
      - fnm.vercel.app
      - omp.sh
      - api.github.com
      - github.com
      - objects.githubusercontent.com
      - raw.githubusercontent.com
      - release-assets.githubusercontent.com
      - nodejs.org
      - registry.npmjs.org
      - cdn.playwright.dev
      - playwright.download.prss.microsoft.com
      - chatgpt.com
      - auth.openai.com
      - api.openai.com
      - api.anthropic.com
      - console.anthropic.com
      - claude.ai
      - api.sonarcloud.io
      - api.cortecs.ai

credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: "%s"
        - domain: console.anthropic.com
          header: x-api-key
          format: "%s"
  - service: cortecs
    apiKey:
      name: CORTECS_API_KEY
      proxyManaged: true
      inject:
        - domain: api.cortecs.ai
          header: Authorization
          format: "Bearer %s"
  - service: sonarqube
    apiKey:
      name: SONARQUBE_TOKEN
      proxyManaged: true
      inject:
        - domain: api.sonarcloud.io
          header: Authorization
          format: "Bearer %s"

setup:
  install:
    - description: "Install the Oh My Pi coding agent"
      command: |
        set -eu
        if [ ! -x "$HOME/.local/bin/omp" ]; then
          installer=$(mktemp)
          trap 'rm -f "$installer"' EXIT
          curl -fsSL https://omp.sh/install -o "$installer"
          sh "$installer" --binary
        fi
      user: "1000"
    - description: "Install the native build toolchain and zsh, then set the agent user's login shell"
      command: |
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        if ! command -v zsh >/dev/null 2>&1 || ! dpkg-query -W build-essential >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends build-essential zsh
          rm -rf /var/lib/apt/lists/*
        fi
        usermod --shell /bin/zsh agent
      user: "0"
    - description: "Install fnm for the agent user"
      command: |
        set -eu
        if [ ! -x "$HOME/.local/share/fnm/fnm" ]; then
          installer=$(mktemp)
          trap 'rm -f "$installer"' EXIT
          curl -fsSL https://fnm.vercel.app/install -o "$installer"
          bash "$installer" --skip-shell
        fi
      user: "1000"
    - description: "Install an architecture-native Chromium and its browser system libraries"
      command: |
        set -eu
        fnm="$HOME/.local/share/fnm/fnm"
        eval "$("$fnm" env --shell bash)"
        "$fnm" install --lts --use
        playwright_version=1.62.1
        browser_root="$HOME/.cache/ms-playwright"
        PLAYWRIGHT_BROWSERS_PATH="$browser_root" \
          npx --yes "playwright@$playwright_version" \
          install --with-deps --no-shell chromium
        browser=
        for candidate in "$browser_root"/chromium-*/chrome-linux*/chrome; do
          if [ -x "$candidate" ]; then
            browser="$candidate"
          fi
        done
        if [ -z "$browser" ]; then
          printf 'Playwright Chromium executable not found under %s\n' "$browser_root" >&2
          exit 1
        fi
        ln -sf "$browser" "$HOME/.local/bin/chromium"
      user: "1000"
    - description: "Expose omp and fnm on the sandbox PATH"
      command: |
        set -eu
        ln -sf /home/agent/.local/bin/omp /usr/local/bin/omp
        ln -sf /home/agent/.local/share/fnm/fnm /usr/local/bin/fnm
      user: "0"
    - description: "Activate fnm in interactive zsh shells"
      command: |
        set -eu
        init='eval "$(fnm env --use-on-cd --version-file-strategy=recursive --resolve-engines --shell zsh)"'
        touch "$HOME/.zshrc"
        grep -Fqx "$init" "$HOME/.zshrc" || printf '\n%s\n' "$init" >> "$HOME/.zshrc"
      user: "1000"
  files:
    - description: "Create the repository-aware Node.js setup command"
      path: /home/agent/.local/bin/setup-project-node
      content: |
        #!/bin/bash
        set -eu
        mkdir -p "$HOME/.cache"
        exec 9>"$HOME/.cache/setup-project-node.lock"
        flock 9
        cd "${WORKDIR}"
        eval "$(fnm env --version-file-strategy=recursive --resolve-engines --shell bash)"
        if ! fnm use --install-if-missing; then
          fnm install --lts --use
        fi
        runtime_bin=$(dirname "$(readlink -f "$(command -v node)")")
        if [ ! -x "$runtime_bin/pnpm" ] ||
          [ ! -x "$runtime_bin/typescript-language-server" ] ||
          [ ! -x "$runtime_bin/vscode-eslint-language-server" ]; then
          npm install --global --prefix "$(dirname "$runtime_bin")" \
            pnpm typescript-language-server typescript @t1ckbase/vscode-langservers-extracted@2.0.2
        fi
        for executable in node npm npx corepack pnpm typescript-language-server vscode-eslint-language-server; do
          ln -sf "$runtime_bin/$executable" "$HOME/.local/bin/$executable"
        done
      mode: "0755"
    - description: "Expose a TypeScript LSP bootstrap before Node.js setup completes"
      path: /home/agent/.local/bin/typescript-language-server
      content: |
        #!/bin/bash
        set -eu
        executable=$(basename "$0")
        /home/agent/.local/bin/setup-project-node
        exec "$HOME/.local/bin/$executable" "$@"
      mode: "0755"
      onlyIfMissing: true
    - description: "Expose an ESLint LSP bootstrap before Node.js setup completes"
      path: /home/agent/.local/bin/vscode-eslint-language-server
      content: |
        #!/bin/bash
        set -eu
        executable=$(basename "$0")
        /home/agent/.local/bin/setup-project-node
        exec "$HOME/.local/bin/$executable" "$@"
      mode: "0755"
      onlyIfMissing: true
  startup:
    - description: "Select the repository's Node.js version and install its Node.js tooling"
      command: [/home/agent/.local/bin/setup-project-node]
      user: "1000"
