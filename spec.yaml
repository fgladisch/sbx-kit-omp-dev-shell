schemaVersion: "1"
kind: sandbox
name: omp
displayName: OMP development shell
description: "Runs Oh My Pi with zsh, fnm, and repository-aware Node.js setup"

sandbox:
  image: "docker/sandbox-templates:shell-docker"
  aiFilename: AGENTS.md
  entrypoint:
    run: [omp]
    args: ["--approval-mode=yolo"]

caps:
  network:
    allow:
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      - download.docker.com
      - fnm.vercel.app
      - get.pnpm.io
      - omp.sh
      - api.github.com
      - github.com
      - objects.githubusercontent.com
      - raw.githubusercontent.com
      - release-assets.githubusercontent.com
      - nodejs.org
      - registry.npmjs.org
      - chatgpt.com
      - auth.openai.com
      - api.openai.com
      - api.anthropic.com
      - console.anthropic.com
      - claude.ai
      - api.sonarcloud.io

credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: "%s"
        - domain: console.anthropic.com
          header: x-api-key
          format: "%s"
  - service: sonarqube
    apiKey:
      name: SONARQUBE_TOKEN
      proxyManaged: true
      inject:
        - domain: api.sonarcloud.io
          header: Authorization
          format: "Bearer %s"

commands:
  install:
    - command: |
        set -eu
        if [ ! -x "$HOME/.local/bin/omp" ]; then
          installer=$(mktemp)
          trap 'rm -f "$installer"' EXIT
          curl -fsSL https://omp.sh/install -o "$installer"
          sh "$installer" --binary
        fi
      user: "1000"
      description: "Install the Oh My Pi coding agent"
    - command: |
        set -eu
        ln -sf /home/agent/.local/bin/omp /usr/local/bin/omp
      user: "0"
      description: "Expose omp on the sandbox PATH"
    - command: |
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        if ! command -v zsh >/dev/null 2>&1 || ! dpkg-query -W build-essential >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends build-essential zsh
          rm -rf /var/lib/apt/lists/*
        fi
        usermod --shell /bin/zsh agent
      user: "0"
      description: "Install the native build toolchain and zsh, then set the agent user's login shell"
    - command: |
        set -eu
        if [ ! -x "$HOME/.local/share/pnpm/bin/pnpm" ]; then
          installer=$(mktemp)
          trap 'rm -f "$installer"' EXIT
          curl -fsSL https://get.pnpm.io/install.sh -o "$installer"
          PNPM_HOME="$HOME/.local/share/pnpm" SHELL=/bin/zsh sh "$installer"
        fi
      user: "1000"
      description: "Install pnpm for the agent user"
    - command: |
        set -eu
        cat > /usr/local/bin/pnpm <<'EOF'
        #!/bin/sh
        exec /home/agent/.local/share/pnpm/bin/pnpm "$@"
        EOF
        chmod 0755 /usr/local/bin/pnpm
      user: "0"
      description: "Expose pnpm on the sandbox PATH"
    - command: |
        set -eu
        if [ ! -x "$HOME/.local/share/fnm/fnm" ]; then
          installer=$(mktemp)
          trap 'rm -f "$installer"' EXIT
          curl -fsSL https://fnm.vercel.app/install -o "$installer"
          bash "$installer" --skip-shell
        fi
      user: "1000"
      description: "Install fnm for the agent user"
    - command: |
        set -eu
        ln -sf /home/agent/.local/share/fnm/fnm /usr/local/bin/fnm
      user: "0"
      description: "Expose fnm on the sandbox PATH"
    - command: |
        set -eu
        init='eval "$(fnm env --use-on-cd --version-file-strategy=recursive --resolve-engines --shell zsh)"'
        touch "$HOME/.zshrc"
        grep -Fqx "$init" "$HOME/.zshrc" || printf '\n%s\n' "$init" >> "$HOME/.zshrc"
      user: "1000"
      description: "Activate fnm in interactive zsh shells"
  initFiles:
    - path: /home/agent/.local/bin/setup-project-node
      content: |
        #!/bin/zsh
        set -euo pipefail
        cd "${WORKDIR}"
        eval "$(fnm env --version-file-strategy=recursive --resolve-engines --shell zsh)"
        fnm use --install-if-missing
      mode: "0755"
      description: "Create repository-aware Node.js setup command"
  startup:
    - command: [/home/agent/.local/bin/setup-project-node]
      user: "1000"
      description: "Install and select the repository's declared Node.js version"
